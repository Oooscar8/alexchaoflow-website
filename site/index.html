<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#143d32">
  <meta name="description" content="AlexChaoFlow 产品主页。认识见山：为 iPhone 和 iPad 打造的个人资产与消费记录 App。">
  <title>AlexChaoFlow · 让日常更清楚</title>
  <link rel="icon" href="./jianshan/assets/app-icon.png">
  <link rel="stylesheet" href="./jianshan/styles.css">
  <style>
    .studio-header{max-width:1160px}
    .studio-name{font:650 21px/1.3 var(--sans);letter-spacing:-.04em}
    .studio-intro{padding:82px 0 67px}
    .studio-intro h1{font-size:clamp(3.3rem,6.7vw,5.8rem)}
    .studio-intro>p:last-child{margin-top:25px;color:var(--muted);font-size:18px}
    .studio-intro .eyebrow{color:var(--muted)}
    .product-card{background:var(--green);color:white;display:grid;grid-template-columns:1.2fr 1fr;gap:55px;align-items:center;border-radius:20px;padding:58px 64px;overflow:hidden}
    .product-card .eyebrow{color:#bfd7c8}
    .product-heading{display:flex;align-items:center;gap:18px}
    .product-heading img{border-radius:16px}
    .product-heading h2{font-size:43px}
    .product-heading p{color:#c5d8cc;font-size:15px;margin-top:4px}
    .product-description{margin-top:27px;max-width:410px;color:#e2ebe4;font-size:18px}
    .product-tags{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 0;padding:0;list-style:none;color:#bfd7c8;font-size:13px}
    .product-tags li{border:1px solid #567564;padding:4px 12px;border-radius:30px}
    .product-card .availability{margin-top:16px}
    .product-card .phone{width:230px;max-width:100%;border-radius:34px}
    .product-card .preview-caption{margin-top:18px}
    .studio-footer{margin-top:78px}
    .studio-footer .studio-name{font-size:18px}
    @media(max-width:900px){.product-card{padding:42px 38px;gap:35px}.product-card .phone{width:210px}.studio-footer>p{width:100%}}
    @media(max-width:640px){.studio-header{height:78px}.studio-header nav{font-size:14px}.studio-name{font-size:20px}.studio-intro{padding:49px 0 40px}.studio-intro h1{font-size:clamp(2.8rem,10.7vw,3.8rem)}.studio-intro>p:last-child{font-size:16px;max-width:285px}.product-card{grid-template-columns:1fr;padding:32px 25px;gap:38px;border-radius:15px}.product-heading h2{font-size:37px}.product-description{font-size:17px}.product-card .phone{width:210px}.studio-footer{margin-top:48px}.studio-footer nav{flex-wrap:wrap;gap:12px 24px}}
  </style>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <header class="header studio-header">
    <a class="studio-name" href="./" aria-label="AlexChaoFlow 首页">AlexChaoFlow</a>
    <nav aria-label="主导航"><a href="#products">产品</a></nav>
  </header>
  <main class="wrap" id="main">
    <section class="studio-intro">
      <p class="eyebrow">DIGITAL PRODUCTS / 日常里的小工具</p>
      <h1>让日常更清楚，<br>让生活更从容。</h1>
      <p>从一份清晰的账本开始，整理生活里的每一笔。</p>
    </section>
    <section class="product-card" id="products" aria-labelledby="jianshan-title">
      <div>
        <p class="eyebrow">01 / IPHONE &amp; IPAD</p>
        <div class="product-heading">
          <img src="./jianshan/assets/app-icon.png" alt="" width="64" height="64">
          <div><h2 id="jianshan-title">见山</h2><p>个人资产追踪</p></div>
        </div>
        <p class="product-description">把分散的资产放在一起，把日常的每一笔记清楚。你的账本，留在你的设备。</p>
        <ul class="product-tags" aria-label="见山功能"><li>多币种资产</li><li>日常记账</li><li>截图识别与审核</li></ul>
        <a class="button light" href="./jianshan/">了解见山 <span aria-hidden="true">&nbsp;↗</span></a>
        <p class="availability">iOS 17 及以上 · App Store 即将上线</p>
      </div>
      <div class="product-view">
        <div class="phone"><img src="./jianshan/assets/overview.png" alt="见山总览界面，展示合成演示资产与快照趋势" width="1320" height="2868" fetchpriority="high"></div>
        <p class="preview-caption">真实 App 界面 · 仅展示演示数据</p>
      </div>
    </section>
  </main>
  <footer class="footer wrap studio-footer">
    <a class="studio-name" href="./">AlexChaoFlow</a>
    <p>让每一笔，更清楚。</p>
    <nav aria-label="页脚导航"><a href="./jianshan/">见山官网</a><a href="./jianshan/privacy/">隐私政策</a><a href="./jianshan/support/">使用支持</a></nav>
  </footer>
</body>
</html>
