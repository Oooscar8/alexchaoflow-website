name: Check and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check website source, links, release metadata and hashes
        run: python3 scripts/check_site.py
      - name: Test deployment guardrails
        run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            node --check "$script"
          done < <(find site -type f -name '*.js' -print0)

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Write deployed commit provenance
        env:
          DEPLOYED_REPOSITORY: ${{ github.repository }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('site/deployment.json').write_text(json.dumps({
              'schema_version': 1,
              'repository': os.environ['DEPLOYED_REPOSITORY'],
              'commit': os.environ['DEPLOYED_COMMIT'],
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
